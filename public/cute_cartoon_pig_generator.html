<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>卡通小猪生成器</title>
  <style>
    :root {
      --color-border-secondary: rgba(0, 0, 0, 0.12);
      --color-background-primary: #fff;
      --color-text-primary: #1a1a1a;
      --color-text-secondary: #666;
      --color-background-secondary: #f5f5f5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-border-secondary: rgba(255, 255, 255, 0.15);
        --color-background-primary: #1e1e1e;
        --color-text-primary: #eee;
        --color-text-secondary: #aaa;
        --color-background-secondary: #2a2a2a;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--color-background-primary);
      color: var(--color-text-primary);
    }
    .pig-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 24px 0; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 560px; }
    .ctrl-btn { padding: 8px 18px; border-radius: 999px; border: 1.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); font-size: 13px; cursor: pointer; transition: all .15s; }
    .ctrl-btn:hover { background: var(--color-background-secondary); }
    .ctrl-btn.active { background: var(--color-text-primary); color: var(--color-background-primary); border-color: var(--color-text-primary); }
    .regen-btn { padding: 10px 28px; border-radius: 999px; border: none; background: var(--color-text-primary); color: var(--color-background-primary); font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity .15s; }
    .regen-btn:hover { opacity: .8; }
    .pig-label { font-size: 13px; color: var(--color-text-secondary); text-align: center; max-width: 90vw; padding: 0 12px; }
    .pig-addr-line {
      font-size: 13px;
      color: var(--color-text-secondary);
      text-align: center;
      max-width: min(560px, 92vw);
      word-break: break-all;
      line-height: 1.5;
    }
    .pig-addr-line a { color: #6b8cff; }
    @media (prefers-color-scheme: dark) {
      .pig-addr-line a { color: #9db4ff; }
    }
    .pig-addr-line[hidden] { display: none !important; }
  </style>
</head>
<body>
<div class="pig-wrap">
  <div class="controls" id="colorPicker">
    <button class="ctrl-btn active" data-color="pink" onclick="setColor(this,'pink')">🌸 粉嫩</button>
    <button class="ctrl-btn" data-color="peach" onclick="setColor(this,'peach')">🍑 蜜桃</button>
    <button class="ctrl-btn" data-color="lavender" onclick="setColor(this,'lavender')">💜 薰衣草</button>
    <button class="ctrl-btn" data-color="mint" onclick="setColor(this,'mint')">🌿 薄荷</button>
    <button class="ctrl-btn" data-color="butter" onclick="setColor(this,'butter')">🌼 奶油</button>
  </div>

  <svg id="pigSvg" width="320" height="340" viewBox="0 0 320 340" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bodyGrad" cx="45%" cy="40%" r="60%">
        <stop id="g1" offset="0%" stop-color="#FFD6E8"/>
        <stop id="g2" offset="100%" stop-color="#FFB3CF"/>
      </radialGradient>
      <radialGradient id="earGrad" cx="50%" cy="50%" r="50%">
        <stop id="g3" offset="0%" stop-color="#FFC0DC"/>
        <stop id="g4" offset="100%" stop-color="#FF95BB"/>
      </radialGradient>
      <radialGradient id="cheekGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FF8FB5" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="#FF6699" stop-opacity="0.3"/>
      </radialGradient>
      <radialGradient id="noseGrad" cx="50%" cy="35%" r="55%">
        <stop id="g5" offset="0%" stop-color="#FFB3CF"/>
        <stop id="g6" offset="100%" stop-color="#FF85AD"/>
      </radialGradient>
      <filter id="soft">
        <feGaussianBlur stdDeviation="1.5" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>

    <ellipse cx="160" cy="318" rx="70" ry="12" fill="#000" fill-opacity="0.08"/>

    <path id="tail" d="M 218 210 Q 255 195 248 175 Q 241 158 260 148" fill="none" stroke="#FFB3CF" stroke-width="6" stroke-linecap="round"/>

    <ellipse id="legBL" cx="113" cy="285" rx="22" ry="30" fill="url(#bodyGrad)"/>
    <ellipse id="hoofBL" cx="113" cy="308" rx="20" ry="10" fill="#FF95BB"/>

    <ellipse id="legBR" cx="207" cy="285" rx="22" ry="30" fill="url(#bodyGrad)"/>
    <ellipse id="hoofBR" cx="207" cy="308" rx="20" ry="10" fill="#FF95BB"/>

    <ellipse id="body" cx="160" cy="230" rx="88" ry="80" fill="url(#bodyGrad)"/>

    <ellipse id="legFL" cx="118" cy="275" rx="20" ry="28" fill="url(#bodyGrad)"/>
    <ellipse id="hoofFL" cx="118" cy="297" rx="18" ry="9" fill="#FF95BB"/>

    <ellipse id="legFR" cx="202" cy="275" rx="20" ry="28" fill="url(#bodyGrad)"/>
    <ellipse id="hoofFR" cx="202" cy="297" rx="18" ry="9" fill="#FF95BB"/>

    <ellipse id="earLO" cx="110" cy="102" rx="30" ry="36" fill="url(#earGrad)" transform="rotate(-15,110,102)"/>
    <ellipse id="earLI" cx="110" cy="102" rx="16" ry="22" fill="#FF6699" fill-opacity="0.6" transform="rotate(-15,110,102)"/>

    <ellipse id="earRO" cx="210" cy="102" rx="30" ry="36" fill="url(#earGrad)" transform="rotate(15,210,102)"/>
    <ellipse id="earRI" cx="210" cy="102" rx="16" ry="22" fill="#FF6699" fill-opacity="0.6" transform="rotate(15,210,102)"/>

    <ellipse id="head" cx="160" cy="158" rx="72" ry="68" fill="url(#bodyGrad)"/>

    <ellipse cx="111" cy="170" rx="22" ry="15" fill="url(#cheekGrad)"/>
    <ellipse cx="209" cy="170" rx="22" ry="15" fill="url(#cheekGrad)"/>

    <ellipse id="snout" cx="160" cy="178" rx="34" ry="26" fill="url(#noseGrad)"/>
    <ellipse cx="150" cy="180" rx="7" ry="5" fill="#CC5577" fill-opacity="0.6"/>
    <ellipse cx="170" cy="180" rx="7" ry="5" fill="#CC5577" fill-opacity="0.6"/>

    <g id="eyeGroup">
      <ellipse cx="135" cy="148" rx="14" ry="15" fill="white"/>
      <ellipse id="pupilL" cx="136" cy="150" rx="7" ry="8" fill="#2C1810"/>
      <circle cx="140" cy="146" r="3" fill="white"/>

      <ellipse cx="185" cy="148" rx="14" ry="15" fill="white"/>
      <ellipse id="pupilR" cx="186" cy="150" rx="7" ry="8" fill="#2C1810"/>
      <circle cx="190" cy="146" r="3" fill="white"/>
    </g>

    <path id="browL" d="M 124 136 Q 135 130 146 134" fill="none" stroke="#CC7799" stroke-width="2.5" stroke-linecap="round"/>
    <path id="browR" d="M 174 134 Q 185 130 196 136" fill="none" stroke="#CC7799" stroke-width="2.5" stroke-linecap="round"/>

    <path id="mouth" d="M 146 193 Q 160 204 174 193" fill="none" stroke="#CC5577" stroke-width="2.5" stroke-linecap="round"/>

    <g id="accessories"></g>

    <g id="sparkles" opacity="0">
      <text x="82" y="100" font-size="18" text-anchor="middle">✨</text>
      <text x="238" y="100" font-size="18" text-anchor="middle">✨</text>
      <text x="160" y="72" font-size="14" text-anchor="middle">⭐</text>
    </g>
  </svg>

  <div class="controls">
    <button class="ctrl-btn active" data-mood="happy" onclick="setMood(this,'happy')">😊 开心</button>
    <button class="ctrl-btn" data-mood="sleepy" onclick="setMood(this,'sleepy')">😴 困困</button>
    <button class="ctrl-btn" data-mood="surprised" onclick="setMood(this,'surprised')">😮 惊讶</button>
    <button class="ctrl-btn" data-mood="love" onclick="setMood(this,'love')">🥰 恋爱</button>
  </div>

  <div class="controls">
    <button class="ctrl-btn active" data-acc="none" onclick="setAcc(this,'none')">原版</button>
    <button class="ctrl-btn" data-acc="hat" onclick="setAcc(this,'hat')">🎩 帽子</button>
    <button class="ctrl-btn" data-acc="bow" onclick="setAcc(this,'bow')">🎀 蝴蝶结</button>
    <button class="ctrl-btn" data-acc="flower" onclick="setAcc(this,'flower')">🌸 小花</button>
  </div>

  <button class="regen-btn" onclick="randomize()">🎲 随机生成</button>
  <div class="pig-addr-line" id="pigAddrLine" hidden></div>
  <div class="pig-label" id="pigName">小猪猪 · 粉嫩款 · 开心版</div>
</div>

<script>
const palettes = {
  pink:     { g1:'#FFE0EE', g2:'#FFB3CF', g3:'#FFC8E0', g4:'#FF95BB', g5:'#FFCCE0', g6:'#FF8FB5', ear:'#FF6699', tail:'#FFB3CF', hoof:'#FF95BB', cheek:'#FF8FB5' },
  peach:    { g1:'#FFE8D6', g2:'#FFCBA8', g3:'#FFD6B8', g4:'#FFA875', g5:'#FFCFB0', g6:'#FF9060', ear:'#FF9955', tail:'#FFCBA8', hoof:'#FFA875', cheek:'#FF9060' },
  lavender: { g1:'#EEE0FF', g2:'#D0A8FF', g3:'#DCC0FF', g4:'#BB85FF', g5:'#D8C0FF', g6:'#AA75EE', ear:'#9955DD', tail:'#D0A8FF', hoof:'#BB85FF', cheek:'#AA75EE' },
  mint:     { g1:'#CCFFE8', g2:'#88DDBB', g3:'#AAEEDD', g4:'#66CC99', g5:'#AAEEDD', g6:'#44BB88', ear:'#33AA77', tail:'#88DDBB', hoof:'#66CC99', cheek:'#44BB88' },
  butter:   { g1:'#FFF8CC', g2:'#FFE880', g3:'#FFF0AA', g4:'#FFD840', g5:'#FFF0AA', g6:'#FFCC00', ear:'#FFBB00', tail:'#FFE880', hoof:'#FFD840', cheek:'#FFAA00' },
};

const moods = {
  happy:     { browL:'M 124 136 Q 135 130 146 134', browR:'M 174 134 Q 185 130 196 136', mouth:'M 146 193 Q 160 207 174 193', eyeL:[135,148,7,8], eyeR:[185,148,7,8], sparkle:false },
  sleepy:    { browL:'M 124 138 Q 135 136 146 138', browR:'M 174 138 Q 185 136 196 138', mouth:'M 148 196 Q 160 200 172 196', eyeL:[135,152,7,4], eyeR:[185,152,7,4], sparkle:false },
  surprised: { browL:'M 122 132 Q 135 124 147 130', browR:'M 173 130 Q 185 124 198 132', mouth:'M 150 192 Q 160 202 170 192', eyeL:[135,146,9,11], eyeR:[185,146,9,11], sparkle:false },
  love:      { browL:'M 124 135 Q 135 129 146 133', browR:'M 174 133 Q 185 129 196 135', mouth:'M 145 194 Q 160 208 175 194', eyeL:[135,148,7,8], eyeR:[185,148,7,8], sparkle:true },
};

const accessories = {
  none:   '',
  hat:    `<g transform="translate(160,88)"><rect x="-42" y="-38" width="84" height="12" rx="6" fill="#3A2A1A"/><rect x="-28" y="-70" width="56" height="36" rx="6" fill="#3A2A1A"/><rect x="-30" y="-42" width="10" height="6" rx="2" fill="#E53935"/></g>`,
  bow:    `<g transform="translate(160,90)"><path d="M-30-20 Q-15-5 0-15 Q15-5 30-20 Q15-30 0-20 Q-15-30 -30-20Z" fill="#FF4488" opacity="0.9"/><circle cx="0" cy="-18" r="7" fill="#FF77BB"/></g>`,
  flower: `<g transform="translate(205,95)"><circle cx="0" cy="0" r="8" fill="#FFEE55"/><circle cx="0" cy="-13" r="7" fill="#FF77AA"/><circle cx="12" cy="-6" r="7" fill="#FF77AA"/><circle cx="12" cy="6" r="7" fill="#FF77AA"/><circle cx="0" cy="13" r="7" fill="#FF77AA"/><circle cx="-12" cy="6" r="7" fill="#FF77AA"/><circle cx="-12" cy="-6" r="7" fill="#FF77AA"/></g>`,
};

const names = ['猪猪', '小粉', '咕噜', '胖丁', '小圆', '噜噜', '芙芙'];

let curColor = 'pink', curMood = 'happy', curAcc = 'none';
/** 来自 URL 的固定文案；无参数时为 null，逻辑与原先一致 */
let urlCustomText = null;

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/** 仅允许 http(s) 链接，避免 javascript: 等 */
function sanitizeHref(raw) {
  if (!raw || typeof raw !== 'string') return '';
  const t = raw.trim();
  try {
    let u;
    if (/^https?:\/\//i.test(t)) u = new URL(t);
    else if (/^\/\//.test(t)) u = new URL('https:' + t);
    else if (/^[a-zA-Z0-9](?:[-a-zA-Z0-9.]*[a-zA-Z0-9])?\.[a-zA-Z]{2,}([/:?#].*)?$/.test(t)) u = new URL('https://' + t);
    else return '';
    if (u.protocol !== 'http:' && u.protocol !== 'https:') return '';
    return u.href;
  } catch (e) {
    return '';
  }
}

function initFromQuery() {
  let sp;
  try {
    sp = new URLSearchParams(window.location.search);
  } catch (e) {
    return;
  }
  const textRaw = sp.get('text') || sp.get('str') || sp.get('msg');
  const addrRaw = sp.get('addr') || sp.get('url') || sp.get('link');
  if (textRaw != null && String(textRaw).length) {
    try {
      urlCustomText = decodeURIComponent(String(textRaw).replace(/\+/g, ' '));
    } catch (e) {
      urlCustomText = String(textRaw);
    }
  }
  const line = document.getElementById('pigAddrLine');
  if (addrRaw != null && String(addrRaw).length) {
    let display;
    try {
      display = decodeURIComponent(String(addrRaw).replace(/\+/g, ' '));
    } catch (e) {
      display = String(addrRaw);
    }
    const href = sanitizeHref(display);
    if (href) {
      line.innerHTML = '链接：<a href="' + escapeHtml(href) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(display) + '</a>';
    } else {
      line.textContent = '地址：' + display;
    }
    line.hidden = false;
  } else {
    line.hidden = true;
    line.textContent = '';
  }
}

function applyPalette(p) {
  const pal = palettes[p];
  document.getElementById('g1').setAttribute('stop-color', pal.g1);
  document.getElementById('g2').setAttribute('stop-color', pal.g2);
  document.getElementById('g3').setAttribute('stop-color', pal.g3);
  document.getElementById('g4').setAttribute('stop-color', pal.g4);
  document.getElementById('g5').setAttribute('stop-color', pal.g5);
  document.getElementById('g6').setAttribute('stop-color', pal.g6);
  ['earLO','earRO'].forEach(id => document.getElementById(id).setAttribute('fill','url(#earGrad)'));
  document.getElementById('tail').setAttribute('stroke', pal.tail);
  ['hoofBL','hoofBR','hoofFL','hoofFR'].forEach(id => document.getElementById(id).setAttribute('fill', pal.hoof));
}

function applyMood(m) {
  const md = moods[m];
  document.getElementById('browL').setAttribute('d', md.browL);
  document.getElementById('browR').setAttribute('d', md.browR);
  document.getElementById('mouth').setAttribute('d', md.mouth);
  const [lx,ly,lrx,lry] = md.eyeL;
  const [rx,ry,rrx,rry] = md.eyeR;
  const pL = document.getElementById('pupilL');
  const pR = document.getElementById('pupilR');
  pL.setAttribute('cx', lx); pL.setAttribute('cy', ly); pL.setAttribute('rx', lrx); pL.setAttribute('ry', lry);
  pR.setAttribute('cx', rx); pR.setAttribute('cy', ry); pR.setAttribute('rx', rrx); pR.setAttribute('ry', rry);
  document.getElementById('sparkles').setAttribute('opacity', md.sparkle ? '1' : '0');
}

function applyAcc(a) {
  document.getElementById('accessories').innerHTML = accessories[a];
}

function updateLabel() {
  const colorNames = { pink:'粉嫩款', peach:'蜜桃款', lavender:'薰衣草款', mint:'薄荷款', butter:'奶油款' };
  const moodNames = { happy:'开心版', sleepy:'困困版', surprised:'惊讶版', love:'恋爱版' };
  const name = urlCustomText != null ? urlCustomText : names[Math.floor(Math.random() * names.length)];
  document.getElementById('pigName').textContent = name + ' · ' + colorNames[curColor] + ' · ' + moodNames[curMood];
}

function setColor(btn, color) {
  document.querySelectorAll('#colorPicker .ctrl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  curColor = color;
  applyPalette(color);
  updateLabel();
}

function setMood(btn, mood) {
  btn.closest('.controls').querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  curMood = mood;
  applyMood(mood);
  updateLabel();
}

function setAcc(btn, acc) {
  btn.closest('.controls').querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  curAcc = acc;
  applyAcc(acc);
}

function randomize() {
  const colors = Object.keys(palettes);
  const moodList = Object.keys(moods);
  const accList = Object.keys(accessories);
  const rc = colors[Math.floor(Math.random() * colors.length)];
  const rm = moodList[Math.floor(Math.random() * moodList.length)];
  const ra = accList[Math.floor(Math.random() * accList.length)];
  curColor = rc; curMood = rm; curAcc = ra;
  document.querySelectorAll('#colorPicker .ctrl-btn').forEach(b => b.classList.toggle('active', b.dataset.color === rc));
  document.querySelectorAll('[data-mood]').forEach(b => b.classList.toggle('active', b.dataset.mood === rm));
  document.querySelectorAll('[data-acc]').forEach(b => b.classList.toggle('active', b.dataset.acc === ra));
  applyPalette(rc); applyMood(rm); applyAcc(ra);
  updateLabel();
  const svg = document.getElementById('pigSvg');
  svg.style.transform = 'scale(1.05)';
  svg.style.transition = 'transform .15s';
  setTimeout(() => { svg.style.transform = 'scale(1)'; }, 150);
}

initFromQuery();
applyPalette('pink');
applyMood('happy');
updateLabel();
</script>
</body>
</html>
